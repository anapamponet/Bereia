<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Calculadora de Divisão</h1>

Digite o primeiro número:
<input type="text" id="input_numero1">



Digite o segundo número:
<input type="text" id="input_numero2">



<button onclick="quociente()">Quociente</button>
<button onclick="resto()">Resto</button>
<button onclick="completo()">Completo</button>

<div id="div_mensagem"></div>
</body>
</html>

<script>
    let numero1;
let numero2;
let resultado;

function quociente() {
    numero1 = Number(input_numero1.value);
    numero2 = Number(input_numero2.value);

    resultado = numero1 / numero2;

    div_mensagem.innerHTML =
        `A divisão de ${numero1} por ${numero2} é: ${resultado}`;
}

function resto() {
    numero1 = Number(input_numero1.value);
    numero2 = Number(input_numero2.value);

    resultado = numero1 % numero2;

    div_mensagem.innerHTML =
        `O resto da divisão de ${numero1} por ${numero2} é: ${resultado}`;
}

function completo() {
    numero1 = Number(input_numero1.value);
    numero2 = Number(input_numero2.value);

    let quociente = numero1 / numero2;
    let resto = numero1 % numero2;

    div_mensagem.innerHTML =
        `A divisão de ${numero1} por ${numero2} é: ${quociente} e o resto dessa divisão é: ${resto}`;
}
</script>
