<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        h1 {
            text-align: center;
        }

        .dashboard {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .grafico {
            background-color: white;
            width: 40vw;
            height: 60vh;
            padding: 15px;
        }
    </style>
</head>

<body>
    <h1>Dashboard de Temperatura e Umidade</h1>

    <div class="dashboard">
        <div class="grafico">
            <canvas id="grafico_linhas"></canvas>
        </div>

        <div class="grafico">
            <canvas id="grafico_barras"></canvas>
        </div>
    </div>
</body>

</html>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const horarios = ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'];

    const dados_linhas = {
        labels: horarios,
        datasets: [
            {
                label: 'Temperatura',
                backgroundColor: 'red',
                borderColor: 'red',
                data: [30, 29, 28, 25, 22, 23]
            },
            {
                label: 'Umidade',
                backgroundColor: 'blue',
                borderColor: 'blue',
                data: [80, 82, 80, 85, 80, 83]
            }
        ]
    };

    const config_linhas = {
        type: 'line',
        data: dados_linhas,
        options: {
            maintainAspectRatio: false,
            plugins: {
                tooltip: {
                    enabled: false
                }
            }
        }
    };

    const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'];

    const dados_barras = {
        labels: meses,
        datasets: [
            {
                label: 'Temperatura Média',
                backgroundColor: 'red',
                borderColor: 'red',
                data: [22, 24, 27, 23, 20, 18]
            },
            {
                label: 'Umidade Média',
                backgroundColor: 'blue',
                borderColor: 'blue',
                data: [90, 89, 93, 87, 88, 82]
            }
        ]
    };

    const config_barras = {
        type: 'bar',
        data: dados_barras,
        options: {
            maintainAspectRatio: false,
            plugins: {
                tooltip: {
                    enabled: false
                }
            }
        }
    };

    new Chart(document.getElementById('grafico_linhas'), config_linhas);
    new Chart(document.getElementById('grafico_barras'), config_barras);
</script>
