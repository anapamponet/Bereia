<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Pizza</h1>

Sabor da pizza:
<input type="text" id="input_sabor">


Preço da pizza:
<input type="text" id="input_preco">


Quantidade de amigos:
<input type="text" id="input_amigos">


<button onclick="calcularPizza()">Ver valor por amigo</button>

<div id="div_mensagem"></div>
</body>
</html>

<script>
let sabor;
let preco;
let amigos;

let taxa;
let total;
let valorAmigo;

function calcularPizza() {
    sabor = input_sabor.value;

    preco = Number(input_preco.value);
    amigos = Number(input_amigos.value);

    taxa = preco * 0.10;

    total = preco + taxa;

    valorAmigo = total / amigos;

    div_mensagem.innerHTML =
        `Cada amigo vai colaborar com R$${valorAmigo} para a pizza de ${sabor}.`;
}
</script>
