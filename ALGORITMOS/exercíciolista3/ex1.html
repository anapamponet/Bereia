<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Calculadora Básica</h1>

Digite o primeiro número:
<input type="text" id="input_numero1">


Digite o segundo número:
<input type="text" id="input_numero2">


<button onclick="somar()">Somar</button>
<button onclick="subtrair()">Subtrair</button>
<button onclick="multiplicar()">Multiplicar</button>
<button onclick="dividir()">Dividir</button>

<div id="div_mensagem"></div>
</body>
</html>

<script>
    let numero1;
let numero2;
let resultado;

function somar() {
    numero1 = Number(input_numero1.value);
    numero2 = Number(input_numero2.value);

    resultado = numero1 + numero2;

    div_mensagem.innerHTML = `A soma entre ${numero1} e ${numero2} é ${resultado}`;
}

function subtrair() {
    numero1 = Number(input_numero1.value);
    numero2 = Number(input_numero2.value);

    resultado = numero1 - numero2;

    div_mensagem.innerHTML = `A diferença entre ${numero1} e ${numero2} é ${resultado}`;
}

function multiplicar() {
    numero1 = Number(input_numero1.value);
    numero2 = Number(input_numero2.value);

    resultado = numero1 * numero2;

    div_mensagem.innerHTML = `O produto entre ${numero1} e ${numero2} é ${resultado}`;
}

function dividir() {
    numero1 = Number(input_numero1.value);
    numero2 = Number(input_numero2.value);

    resultado = numero1 / numero2;

    div_mensagem.innerHTML = `A razão entre ${numero1} e ${numero2} é ${resultado}`;
}
</script>
