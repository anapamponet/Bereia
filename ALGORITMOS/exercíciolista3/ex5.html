<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Fases do Sono</h1>

Quantas horas você dormiu?
<input type="text" id="input_horas">


<button onclick="calcularSono()">Calcular Sono</button>

<div id="div_mensagem"></div>
</body>
</html>

<script>
    let horas;
let fase1;
let fase2;
let fase3;
let rem;

function calcularSono() {
    horas = Number(input_horas.value);

    fase1 = horas * 0.05;
    fase2 = horas * 0.45;
    fase3 = horas * 0.25;
    rem = horas * 0.25;

    div_mensagem.innerHTML = `
        Ao dormir ${horas} horas, você dormiu:<br>
        ${fase1} horas na fase 1<br>
        ${fase2} horas na fase 2<br>
        ${fase3} horas na fase 3<br>
        ${rem} horas na fase REM
    `;
}
</script>
