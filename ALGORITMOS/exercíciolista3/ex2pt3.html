<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Depósito e Retirada</h1>

Digite o valor:
<input type="text" id="input_valor">


<button onclick="depositar()">Depositar</button>
<button onclick="retirar()">Retirar</button>

<div id="div_mensagem"></div>
</body>
</html>

<script>
    let saldo = 0;
let valor;

function depositar() {
    valor = Number(input_valor.value);

    saldo = saldo + valor;

    div_mensagem.innerHTML =
        `Depósito de R$${valor} efetuado! Saldo atual: R$${saldo}`;
}

function retirar() {
    valor = Number(input_valor.value);

    saldo = saldo - valor;

    div_mensagem.innerHTML =
        `Retirada de R$${valor} efetuada! Saldo atual: R$${saldo}`;
}
</script>
