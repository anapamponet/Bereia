<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="qtdrefri">
    <button onclick="refris()">Quantos refris?</button>

    <div id="divcalculo"></div>
    
</body>
</html>

<script>
    function refris(){
        let refrigerantes = Number(qtdrefri.value)
        let latas = refrigerantes * 365
        let msg = `A quantidade de latas por dia da o total de ${latas} por ano.`

        divcalculo.innerHTML = msg

        if (latas >500){
    
        divcalculo.innerHTML = msg + ` Cuidado com a diabetes!`
        }

    }
</script>
