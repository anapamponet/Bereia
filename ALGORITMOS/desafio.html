<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Quantidade de batalhas
    <input type="text" id="ipt_batalhas">
    <br>
    Quantidade de marinheiros em cada batalha
    <input type="text" id="ipt_marinheiros">
    <br>
    Quantidade de carnes disponíveis
    <input type="text" id="ipt_carnes">
    <br>
    <button onclick="iniciar()">Iniciar Batalha</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function iniciar(){
        let batalhas = Number(ipt_batalhas.value)
        let marinheiros = Number(ipt_marinheiros.value)
        let carnes = Number(ipt_carnes.value)
        let pontos = 100
        let round = 1

        for(let rodadas = 0; rodadas <= batalhas ; rodadas ++){
            div_exibir.innerHTML += `Quantidade de rodadas ${round} <br>`
            round ++

            // if (pontos <10){
            //     pontos + 100
            //     carnes -1
            // }

            if (batalhas > 1){
            div_exibir.innerHTML += `Energia ${pontos -= 10} <br>`
            } else if (carnes > 1 && pontos <= 10){
                div_exibir.innerHTML += `Comeu carnes ${pontos += 100}`
            }

        let derrota = 0
        for(let derrota = 0; derrota < marinheiros; marinheiros --){
            derrota ++
            pontos -= 5
            marinheiros --
            div_exibir.innerHTML += `${derrota} Marinheiros mortos <br>`
        }
        }
        if(marinheiros < batalhas){
                div_exibir.innerHTML += `Luffy venceu a batalha<br>`
            } else{
                div_exibir.innerHTML += `Luffy derrotado<br>`
            }

    }
</script>
