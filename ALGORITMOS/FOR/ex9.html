<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Digite um número (de 0 a 200):
    <input type="text" id="ipt_num">
    <br>
    <button onclick="viva7()">Viva o 7!</button>
    <div id="div_sete"></div>
</body>
</html>
<script>
    function viva7() {
        let numero = Number(ipt_num.value);
        div_sete.innerHTML = '';

        if (numero < 0 || numero > 200) {
            div_sete.innerHTML = 'O número deve estar entre 0 e 200.';
        }

        for (let cont = 1; cont <= numero; cont++) {
            if (cont % 7 == 0) {
                div_sete.innerHTML += `${cont} <br>`;
            }
        }
    }
</script>
