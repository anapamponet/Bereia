<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Digite um número (de 20 a 100):
    <input type="text" id="ipt_num">
    <br>
    <button onclick="multiplos5()">Adoro múltiplos de 5</button>
    <div id="div_multiplos"></div>
</body>
</html>
<script>
    function multiplos5() {
        let numero = Number(ipt_num.value);
        div_multiplos.innerHTML = '';

        if (numero < 20 || numero > 100) {
            div_multiplos.innerHTML = 'O número deve estar entre 20 e 100.';
        }

        for (let cont = 1; cont <= numero; cont++) {
            if (cont % 5 == 0) {
                div_multiplos.innerHTML += `${cont} <br>`;
            }
        }
    }
</script>
