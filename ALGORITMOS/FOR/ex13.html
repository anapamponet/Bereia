<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Digite um número:
    <input type="text" id="ipt_num">
    <br>
    Digite uma frase:
    <input type="text" id="ipt_frase">
    <br>
    <button onclick="papagaio()">Papagaio</button>
</body>
</html>
<script>
    function papagaio() {
        let numero = Number(ipt_num.value);
        let frase = ipt_frase.value;
        let fala = '';

        for (let cont = 1; cont <= numero; cont++) {
            fala += `${frase} `;
        }

        for (let alerta = 1; alerta <= numero; alerta++) {
            alert(fala);
        }
    }
</script>
