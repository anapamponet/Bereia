<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Tabuada do:
    <select id="slt_tabuada">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
    </select>
    <br>
    Até que número?
    <input type="text" id="ipt_ate">
    <br>
    <button onclick="verTabuada()">Ver Tabuada</button>
    <div id="div_tabuada"></div>
</body>
</html>
<script>
    function verTabuada() {
        let tabuada = Number(slt_tabuada.value);
        let ate = Number(ipt_ate.value);
        div_tabuada.innerHTML = '';

        if (ate < 1) {
            div_tabuada.innerHTML = 'Informe um número maior que 0.';
        }

        for (let mult = 1; mult <= ate; mult++) {
            let resultado = tabuada * mult;

            if (mult % 2 == 0) {
                div_tabuada.innerHTML += `<span style="color: blue;">${tabuada} x ${mult} = ${resultado}</span><br>`;
            } else {
                div_tabuada.innerHTML += `<span style="color: red;">${tabuada} x ${mult} = ${resultado}</span><br>`;
            }
        }
    }
</script>
