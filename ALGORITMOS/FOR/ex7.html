<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="pares()">S2 Pares</button>
    <div id="div_pares"></div>
</body>
</html>
<script>
    function pares() {
        div_pares.innerHTML = '';

        for (let num = 0; num <= 100; num++) {
            if (num % 2 == 0) {
                div_pares.innerHTML += `${num} <br>`;
            }
        }
    }
</script>
