<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="filtrar()">Filtrar números Cabalísticos</button>
    <div id="div_numeros"></div>
</body>
</html>
<script>
    function filtrar() {
        div_numeros.innerHTML = '';

        for (let num = 1; num <= 30; num++) {
            if (num != 3 && num != 4 && num != 7 && num != 10 && num != 12) {
                div_numeros.innerHTML += `${num} <br>`;
            }
        }
    }
</script>
