<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Contagem Simples 
    <button onclick="contagem()">conte</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function contagem(){
        for(let contador = 0 ; contador <= 15; contador++){
            div_exibir.innerHTML += `${contador} <br>`
        }
    }
</script>
