<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Início do intervalo:
    <input type="text" id="ipt_inicio">
    <br>
    Fim do intervalo:
    <input type="text" id="ipt_fim">
    <br>
    Número para o teste (de 3 a 13):
    <input type="text" id="ipt_divisor">
    <br>
    <button onclick="divisivel()">Divisível</button>
    <div id="div_resultado"></div>
</body>
</html>
<script>
    function divisivel() {
        let inicio = Number(ipt_inicio.value);
        let fim = Number(ipt_fim.value);
        let divisor = Number(ipt_divisor.value);
        div_resultado.innerHTML = '';

        if (inicio >= fim) {
            div_resultado.innerHTML = 'O intervalo deve ser crescente.';
        } else if (divisor < 3 || divisor > 13) {
            div_resultado.innerHTML = 'O número do teste deve estar entre 3 e 13.';
        }

        for (let cont = inicio; cont <= fim; cont++) {
            if (cont % divisor != 0) {
                div_resultado.innerHTML += `${cont} <br>`;
            }
        }
    }
</script>
