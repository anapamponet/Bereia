<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    CAPACIDADE FLEXÍVEL
<br>
     Quantas pessoas vão entrar no carro?
    <input type="text" id="ipt_qtdpessoas">
    <br>
    Qual a capacidade desse carro?
    <input type="text" id="ipt_capacidade">
    <br>

    <button onclick="partiu()">#Partiu Carona</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function partiu(){
        let qp = Number(ipt_qtdpessoas.value);
        let capacidade = Number(ipt_capacidade.value);
        
        for(let passageiro = 1; passageiro <= qp; passageiro ++){
            if(passageiro == 1){
                div_mensagem.innerHTML += `O passageiro número ${passageiro} é o(a) motorista. <br>`
            } else if(passageiro <= capacidade){
                div_mensagem.innerHTML += `Entrou o passageiro número ${passageiro}. <br>`
            } else {
                div_mensagem.innerHTML += `O passageiro número ${passageiro} terá de esperar.<br>`
            }
        }}
</script>
