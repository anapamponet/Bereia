<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    EXIBIÇÃO DE PARES
<br>
    Número de 1 a 10:
    <input type="text" id="ipt_num1">
    <br>
    Número de 30 a 100:
    <input type="text" id="ipt_num2">
    <br>
    <button onclick="show()">Exibir pares</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function show(){
        let primeiro = Number(ipt_num1.value);
        let segundo = Number(ipt_num2.value);
        
        if (primeiro <1 || primeiro > 10){
            div_exibir.innerHTML = `O primeiro número deve estar entre 1 e 10. <br>`
        } else if (segundo <30 || segundo >100){
            div_exibir.innerHTML = `O segundo número deve estar entre 30 e 100. <br>`
        }

        for(let cont = primeiro; cont <= segundo; cont++)
            if (cont % 2 == 0){
                div_exibir.innerHTML += `${cont} <br>`
            }
    }
</script>
