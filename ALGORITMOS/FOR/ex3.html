<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Frase Numerada
    <button onclick="frases()">Frase</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let frase = `Bão dia`
    function frases(){
        for(let contador = 1; contador <=7; contador++){
            div_exibir.innerHTML += `${contador}. ${frase}<br>`
        }
    }
</script>
