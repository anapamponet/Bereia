<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Controle de Estoque
    <br>
    Preço do produto:
    <input type="text" id="ipt_preco">
    <br>
    <button onclick="cadastrar()">Cadastrar</button>
    <button onclick="atualizar()">Atualizar Estoque</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let precos = []

    function cadastrar(){
        if(ipt_preco.value == ''){
            alert('Digite um preço!')
        } else {
            precos[precos.length] = Number(ipt_preco.value)
            ipt_preco.value = ''
        }
    }

    function atualizar(){
        div_exibir.innerHTML = ''
        let soma = 0

        for(let contador = precos.length - 1; contador >= 0; contador--){
            div_exibir.innerHTML += `R$${precos[contador]} <br>`
        }

        for(let contador = 0; contador < precos.length; contador++){
            soma += precos[contador]
        }

        div_exibir.innerHTML += `<br>Você tem ${precos.length} produtos cadastrados em estoque <br>`
        div_exibir.innerHTML += `Seu estoque vale R$${soma}`
    }
</script>
