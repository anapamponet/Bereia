<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Histórico de Números
    <br>
    Digite um número qualquer:
    <input type="text" id="ipt_num">
    <br>
    <button onclick="analisar()">Analisar histórico</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let numeros = []

    function analisar(){
        if(ipt_num.value == ''){
            alert('Digite um número!')
        } else {
            numeros[numeros.length] = Number(ipt_num.value)
            ipt_num.value = ''

            let maior = numeros[0]
            let menor = numeros[0]
            div_exibir.innerHTML = ''

            for(let contador = 0; contador < numeros.length; contador++){
                div_exibir.innerHTML += `${contador + 1}º Número: ${numeros[contador]} <br>`

                if(numeros[contador] > maior){
                    maior = numeros[contador]
                } else if(numeros[contador] < menor){
                    menor = numeros[contador]
                }
            }

            div_exibir.innerHTML += `Maior: ${maior} <br>`
            div_exibir.innerHTML += `Menor: ${menor}`
        }
    }
</script>
