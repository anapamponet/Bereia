<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Cadastro de Alunos com Exibição Invertida
    <br>
    Nome do aluno:
    <input type="text" id="ipt_aluno">
    <br>
    <button onclick="cadastrar()">Cadastrar</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let alunos = []

    function cadastrar(){
        alunos[alunos.length] = ipt_aluno.value
        ipt_aluno.value = ''
        div_exibir.innerHTML = ''
        
        for(let contador = alunos.length - 1; contador >= 0; contador--){
            div_exibir.innerHTML += `${alunos[contador]} <br>`
        }
    }
</script>
