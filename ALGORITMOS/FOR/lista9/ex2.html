<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Filmes em Cores
    <br>
    Nome do filme:
    <input type="text" id="ipt_filme">
    <br>
    <button onclick="cadastrar()">Cadastrar</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let filmes = []

    function cadastrar(){
        filmes[filmes.length] = ipt_filme.value
        ipt_filme.value = ''
        div_exibir.innerHTML = ''
        
        for(let contador = 0; contador < filmes.length; contador++){
            if(contador % 2 == 0){
                div_exibir.innerHTML += `<span style="color: blue;">${filmes[contador]}</span><br>`
            } else {
                div_exibir.innerHTML += `<span style="color: red;">${filmes[contador]}</span><br>`
            }
        }
    }
</script>
