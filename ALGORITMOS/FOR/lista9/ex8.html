<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Cadastro de Filhos
    <br>
    Nome do filho:
    <input type="text" id="ipt_filho">
    <br>
    <button onclick="cadastrar()">Cadastrar</button>
    <button onclick="atualizar()">Atualizar Família</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let filhos = []

    function cadastrar(){
        let filho = ipt_filho.value
        let repetido = false

        for(let contador = 0; contador < filhos.length; contador++){
            if(filhos[contador] == filho){
                repetido = true
            }
        }

        if(repetido){
            alert('Não pode mais de 1 filho com o mesmo nome!')
        } else {
            filhos[filhos.length] = filho
            ipt_filho.value = ''
        }
    }

    function atualizar(){
        let qtd = filhos.length
        let particular = qtd * 3000
        let publica = qtd * 1500

        div_exibir.innerHTML = `Você tem ${qtd} filhos <br>`
        div_exibir.innerHTML += `Seu custo mensal será aproximadamente R$${particular} se colocá-los em escola particular ou R$${publica} se eles estudarem em escola pública`
    }
</script>
