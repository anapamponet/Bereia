<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Campanha do Time
    <br>
    Indique o resultado:
    <select id="slt_resultado">
        <option value="Vitória">Vitória</option>
        <option value="Empate">Empate</option>
        <option value="Derrota">Derrota</option>
    </select>
    <br>
    <button onclick="registrar()">Registrar jogo</button>
    <div id="div_resumo"></div>
    <br>
    Indique qual jogo deseja saber o resultado:
    <input type="text" id="ipt_jogo" oninput="consultar()">
    <div id="div_jogo"></div>
</body>
</html>
<script>
    let resultados = []

    function registrar(){
        resultados[resultados.length] = slt_resultado.value

        let vitorias = 0
        let empates = 0
        let derrotas = 0

        for(let contador = 0; contador < resultados.length; contador++){
            if(resultados[contador] == 'Vitória'){
                vitorias++
            } else if(resultados[contador] == 'Empate'){
                empates++
            } else {
                derrotas++
            }
        }

        let pontos = vitorias * 3 + empates
        let pontosPossiveis = resultados.length * 3
        let aproveitamento = pontos / pontosPossiveis * 100

        div_resumo.innerHTML = `O time teve: ${vitorias} vitórias, ${empates} empates, ${derrotas} derrotas <br>`
        div_resumo.innerHTML += `Pontuação total: ${pontos} pontos <br>`
        div_resumo.innerHTML += `Aproveitamento: ${aproveitamento}%`

        consultar()
    }

    function consultar(){
        if(ipt_jogo.value == ''){
            div_jogo.innerHTML = ''
        } else {
            let jogo = Number(ipt_jogo.value)
            let indice = jogo - 1

            if(indice >= 0 && indice < resultados.length){
                let texto = ''

                if(resultados[indice] == 'Vitória'){
                    texto = 'Ganhou'
                } else if(resultados[indice] == 'Empate'){
                    texto = 'Empatou'
                } else {
                    texto = 'Perdeu'
                }

                div_jogo.innerHTML = `No ${jogo}º jogo, o time ${texto}`
            } else {
                div_jogo.innerHTML = `Não foi cadastrado um ${jogo}º jogo`
            }
        }
    }
</script>
