<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Frase repetitiva
    <button onclick="repetir()">Repetir</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let frase = `Algoritmo né pae`
    function repetir(){
        for(let contador = 0; contador <= 7; contador++ ){
            div_exibir.innerHTML += `${contador}. ${frase}<br>`
        }
    }
</script>
