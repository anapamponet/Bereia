<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Biblioteca do Zoro <br>
    Título: <br>
    <input type="text" id="ipt_titulo"> <br>
    categoria: <br>
    <input type="text" id="ipt_cat"> <br>
    número de páginas: <br>
    <input type="text" id="ipt_numpag"> <br>

    <button onclick="cadastrar()">Cadastrar</button>
    <div id="div_saida"></div>
</body>
</html>
<script>
    let livros = [];
    function cadastrar(){
        let titulo = ipt_titulo.value;
        let cat = ipt_cat.value;
        let num = Number(ipt_numpag.value);
        let existe = false;

        if (titulo == ""){
            div_saida.innerHTML+= `Insira o título do livro`
        } else{
            for (let i = 0; i < livros.length; i++){
                if (livros[i].titulo == titulo){
                    existe = true;
                }
                if (existe == true){
                    div_saida.innerHTML = `livro já inserido`;
                } else {
                    if (cat != "Tecnica" && cat != "Historia" && cat != "Estratégia" && cat!= "Lenda"){
                        div_saida.innerHTML = `Categoria inválida`;
                    } else if (num <= 0){
                        div_saida.innerHTML = `O número de páginas deve ser maior que 0`;
                    } else {
                        
                         let livro = {
                            titulo: titulo,
                            categoria: cat,
                            paginas: num,
                            emprestado: false};

                        livros.push(livro);
                        div_saida.innerHTML = `Livro: ${titulo} cadastrado com sucesso!`

                    }
                }
            }
        }

     
        } 

</script>
