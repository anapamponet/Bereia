<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>CRUD do Sanji</title>
</head>
<body>
  <h1>Estoque do Sanji</h1>

  <h2>Cadastrar Estoque de Comidas</h2>
  <input type="text" id="comida">
  <button onclick="cadastrar()">Cadastrar</button>
  <button onclick="verificarQuantidade()">Verificar Quantidade</button>

  <h2>Pesquisar comida</h2>
  <input type="text" id="pesquisa">
  <button onclick="pesquisar()">Pesquisar</button>

  <h2>Estoque</h2>
  <button onclick="exibirEstoque()">Exibir Estoque</button>

  <h2>Alterar nome de comida</h2>
  Nome atual: <input type="text" id="nomeAtual"><br>
  Novo nome: <input type="text" id="nomeNovo"><br>
  <button onclick="alterarNome()">Alterar Nome</button>

  <h2>Remover comida</h2>
  <input type="text" id="remover">
  <button onclick="removerComida()">Remover Comida</button>

  <hr>
  <h2>Resultado</h2>
  <div id="saida"></div>

  <script>
    // Lista única. Repetições representam a quantidade em estoque.
    var comidas = [];

    function mostrar(mensagem) {
      document.getElementById("saida").innerHTML = mensagem;
    }

    // Compara sem diferenciar maiúsculas/minúsculas e sem espaços sobrando
    function igual(a, b) {
      return a.trim().toLowerCase() === b.trim().toLowerCase();
    }

    // Conta quantas vezes um nome aparece na lista
    function contar(nome) {
      var total = 0;
      for (var i = 0; i < comidas.length; i++) {
        if (igual(comidas[i], nome)) {
          total++;
        }
      }
      return total;
    }

    // ---------- PARTE 1 ----------
    function cadastrar() {
      var nome = document.getElementById("comida").value.trim();

      if (nome === "") {
        mostrar("Erro: digite o nome da comida que deseja cadastrar.");
        return;
      }

      comidas.push(nome); // repetidos são permitidos
      document.getElementById("comida").value = "";
      mostrar("Comida '" + nome + "' cadastrada com sucesso!");
    }

    function verificarQuantidade() {
      var qtd = comidas.length;

      if (qtd < 3) {
        mostrar("Desse jeito, o Luffy devora até o navio");
      } else if (qtd <= 7) {
        mostrar("O comilão do Luffy não vai deixar sobrar nenhuma comida");
      } else if (qtd <= 10) {
        mostrar("Assim, talvez sobre um pouco para a tripulação");
      } else {
        mostrar("Desse jeito vai ter comida para todo mundo e ainda consigo guardar um pouco para a senhorita Nami!");
      }
    }

    // ---------- PARTE 2 ----------
    function pesquisar() {
      var nome = document.getElementById("pesquisa").value.trim();

      if (nome === "") {
        mostrar("Erro: digite o nome da comida que deseja pesquisar.");
        return;
      }

      var qtd = contar(nome);

      if (qtd > 0) {
        mostrar("Temos a comida " + nome + " e há " + qtd + " unidade(s) dela");
      } else {
        mostrar("Alguém vai ter que comprar " + nome + ", tá fazendo falta...");
      }
    }

    function exibirEstoque() {
      if (comidas.length === 0) {
        mostrar("O estoque está vazio.");
        return;
      }

      var texto = "";
      var jaMostradas = []; // nomes que já apareceram na tela

      for (var i = 0; i < comidas.length; i++) {
        var nome = comidas[i];

        // Só mostra se ainda não foi mostrada
        var jaFoi = false;
        for (var j = 0; j < jaMostradas.length; j++) {
          if (igual(jaMostradas[j], nome)) {
            jaFoi = true;
          }
        }

        if (jaFoi === false) {
          var qtd = contar(nome);
          var palavra = "unidades";
          if (qtd === 1) {
            palavra = "unidade";
          }
          texto += "- " + nome + " (" + qtd + " " + palavra + ")<br>";
          jaMostradas.push(nome);
        }
      }

      mostrar(texto);
    }

    // ---------- PARTE 3 ----------
    function alterarNome() {
      var antigo = document.getElementById("nomeAtual").value.trim();
      var novo = document.getElementById("nomeNovo").value.trim();

      if (antigo === "") {
        mostrar("Erro: digite o nome atual da comida.");
        return;
      }
      if (novo === "") {
        mostrar("Erro: digite o novo nome da comida.");
        return;
      }

      if (contar(antigo) === 0) {
        mostrar("A comida '" + antigo + "' não foi encontrada no estoque.");
        return;
      }

      // Troca TODAS as ocorrências
      for (var i = 0; i < comidas.length; i++) {
        if (igual(comidas[i], antigo)) {
          comidas[i] = novo;
        }
      }

      mostrar("A comida '" + antigo + "' foi alterada para '" + novo + "'");
    }

    function removerComida() {
      var nome = document.getElementById("remover").value.trim();

      if (nome === "") {
        mostrar("Erro: digite o nome da comida que deseja remover.");
        return;
      }

      if (contar(nome) === 0) {
        mostrar("A comida '" + nome + "' não está no estoque.");
        return;
      }

      // De trás para frente, para o splice não bagunçar os índices
      for (var i = comidas.length - 1; i >= 0; i--) {
        if (igual(comidas[i], nome)) {
          comidas.splice(i, 1);
        }
      }

      mostrar("A comida '" + nome + "' foi removida do estoque.");
    }
  </script>
</body>
</html>
