<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="input_valor">
    <input type="text" id="input_amigos">
    
    <button onclick="rola()"> Rola a pizza? </button>

    <div id="divrola"></div>

</body>
</html>

<script>
    function rola(){
        let valor = Number(input_valor.value)
        let amigos = Number(input_amigos.value)
        let valorfinal = valor / amigos
        let mensagem = `Cada amigo vai pagar R$${valorfinal} pela pizza. `

        divrola.innerHTML = mensagem

        if (valorfinal >20)
        divrola.innerHTML= mensagem + `Deu ruim! Pizza muito cara!`
    }
</script>
