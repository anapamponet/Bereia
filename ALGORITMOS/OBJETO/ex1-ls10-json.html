<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    CADASTRO DE PETS COM INFORMAÇÕES AGRUPADAS
    <br>
    Nome:
    <input type="text" id="ipt_nome">
    <br>
    Tipo do animal:
    <input type="text" id="ipt_tipo">
    <br>
    Idade:
    <input type="text" id="ipt_age">
    <br>
    <button onclick="cadastrar()">CADASTRAR PET</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function cadastrar(){
        let infoAnimal ={
            nome: ipt_nome.value,
            tipo: ipt_tipo.value,
            idade: Number(ipt_age.value)
        }
        div_mensagem.innerHTML = `Informações: <br> Nome: ${infoAnimal.nome} <br> Tipo: ${infoAnimal.tipo} <br> Idade: ${infoAnimal.idade}.`
    }
</script>
