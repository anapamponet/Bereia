<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    CADASTRO DE FILMES COM CLASSIFICAÇÃO  
     <br>
    Nome do Filme:
    <input type="text" id="ipt_nome">
    <br>
    Gênero:
    <input type="text" id="ipt_gender">
    <br>
    Nota:
    <input type="text" id="ipt_nota">
    <br>
    <button onclick="cadastrar()">CADASTRAR FILME</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function cadastrar(){
        let firme = {
            nome: ipt_nome.value,
            gender: ipt_gender.value,
            nota: Number(ipt_nota.value)
        }
        div_mensagem.innerHTML = `Filme: ${firme.nome}<br>
                                  Gênero: ${firme.gender}<br>
                                  Nota: ${firme.nota}<br>`
        if(firme.nota >= 8){
            div_mensagem.innerHTML += `Classificação: Filme Excelente`
        } else{
            div_mensagem.innerHTML += `Classificação: Filme Regular`
        }
    }
</script>
