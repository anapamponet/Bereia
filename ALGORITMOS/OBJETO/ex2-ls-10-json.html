<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    CADASTRO DE FUNCIONÁRIOS COM ALTERAÇÃO DE DADOS
     <br>
    Nome do funcionário:
    <input type="text" id="ipt_nome">
    <br>
    Cargo:
    <input type="text" id="ipt_cargo">
    <br>
    Salário:
    <input type="text" id="ipt_sal">
    <br>
    <button onclick="cadastrar()">CADASTRAR FUNCIONÁRIO</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function cadastrar(){
        let infoFunc = {
            nome: ipt_nome.value.toUpperCase(),
            cargo: ipt_cargo.value,
            sal: ipt_sal.value
        }
            infoFunc.bonus = ipt_sal.value * 0.10
            infoFunc.somado = ipt_sal.value * 1.10
        div_mensagem.innerHTML =`Informações do funcionário: <br>
                                 Nome: ${infoFunc.nome} <br>
                                 Cargo: ${infoFunc.cargo} <br>
                                 Salário: ${infoFunc.sal} <br>
                                 Bônus: ${infoFunc.bonus.toFixed(2)} <br>
                                 Salário com Bônus: ${infoFunc.somado.toFixed(2)}`
    }
</script>
