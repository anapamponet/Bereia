<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    CADASTRO DE PRODUTOS COM ATUALIZAÇÃO DO ESTOQUE
     <br>
    Nome do produto:
    <input type="text" id="ipt_nome">
    <br>
    Quantidade em estoque:
    <input type="text" id="ipt_qtd">
    <br>
    Preço:
    <input type="text" id="ipt_preco">
    <br>
    <button onclick="cadastrar()">CADASTRAR PRODUTO</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function cadastrar(){
        let produto ={
            nome: ipt_nome.value,
            qtd: Number(ipt_qtd.value),
            preco: Number(ipt_preco.value)
        }
        produto.qtdplus = produto.qtd + 10
        produto.valortotal = produto.qtdplus * produto.preco
        div_mensagem.innerHTML = `Produto: ${produto.nome} <br>
                                  Quantidade Atualizada: ${produto.qtdplus} <br>
                                  Preço unitário: ${produto.preco} <br>
                                  Valor Total: ${produto.valortotal}`
    }
</script>
