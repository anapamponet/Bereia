<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Valor:
    <input type="text" id="Input_valor">
    <br>
    <button onclick="adicionar()">adicionar</button>
    <button onclick="exibir()">exibir</button>
    <button onclick="remover()">remover</button>
    <button onclick="analisar()">analisar</button>
    <button onclick="pesquisar()">pesquisar</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    let lista = [];

    function exibir(){
        div_mensagem.innerHTML = `${lista}`
        div_mensagem.innerHTML += `<br>${lista}`.replaceAll(',', '<br>');
    }
    function adicionar(){
        let valor = Input_valor.value;
        lista.push(valor);
        console.log(lista);
    }
    function remover(){
        let removido = lista.pop();
        console.log(`Valor removido: ${removido}`)
        console.log(lista)
    }
    function analisar(){
        div_mensagem.innerHTML =`
        Tamanho: ${lista.length} <br>
        Primeiro: ${lista[0]} <br>
        Terceiro: ${lista[2]} <br>
        Último: ${lista[lista.length - 1]}`
    }
    function pesquisar(){
        let valor = Input_valor.value;
        if(lista.includes(valor)){
            let indice = lista.indexOf(valor);
            div_mensagem.innerHTML = `A lista inclui ${valor}`
        } else {
            div_mensagem.innerHTML = `A lista não inclui ${valor} `
        }
    }
</script>
