<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Detector de Palavras</h1>

    <label for="input_frase">Insira a frase: </label>
    <br>
    <input type="text" id="input_frase">
    <button onclick="analisar()"> Analisar Frase </button>

    <div id="div_mensagem"></div> </b>
</body>
</html>
<script>
    function analisar(){
        let frase = input_frase.value
        
        if(frase.includes('teste')||frase.includes('abc')||frase.includes('spam')){
            div_mensagem.innerHTML = `<b style="color: red;">Frase Inválida!</b>`
        } else {
            div_mensagem.innerHTML = `<b style="color: green;">Frase Válida!</b>`
        }
    }
</script>
