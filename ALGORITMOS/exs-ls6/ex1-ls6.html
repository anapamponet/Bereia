<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Contador de Caracteres</h1>

    <label for="input_frase">Insira uma frase:</label>
    <input type="text" id="input_frase">

    <button onclick="analisar()"> Analizar Frase </button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function analisar(){
        let frase = input_frase.value
        div_mensagem.innerHTML = `Tamanho da Frase: ${frase.length}`
        if (frase.length < 10){
            div_mensagem.innerHTML = `<b style="color: red;">Frase Curta!</b>`
        } else {
            div_mensagem.innerHTML = `<b style="color: blue;">Frase Longa!</b>`
        }
    }
</script>
