<body>
     usuário informa quantos depósitos ele fez no banco.
     <input type="text" id="ipt_depositos"><br><br>
     usuário informa o valor de cada depósito, pois ele sempre depositava exatamente o mesmo valor.
     <input type="text" id="ipt_valorDeposito"><br><br>
     usuário informa a cada quantos meses o bônus é aplicado. 
     <input type="text" id="ipt_frequencia"><br>
<br>
     <button onclick="acompanhar()">Acompanhar grana</button>
     <div id="div_extrato"></div>
</body>
</html>
<script>
    function acompanhar(){
        let qtddep = Number(ipt_depositos.value);
        let valor = Number(ipt_valorDeposito.value);
        let freq = Number(ipt_frequencia.value);
        let cont = 1
        let bônus = 1/100
        let meses = 0
        let totaldep = 0
        let totalguardado = 0

        while(cont <= freq){
            cont++
            meses++
            if(cont >= valor){
                div_extrato.innerHTML += `Valor adicionado de ${valor}`
            }

        }
    }
</script>
