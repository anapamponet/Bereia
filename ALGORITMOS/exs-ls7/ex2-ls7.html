<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button onclick="repetir()">Diga algo sobre a matéria de Algoritmos</button>

    <div id="div_msg"></div>
</body>

</html>

<script>
    function repetir() {
        let mensagem = 'Algoritmos é a base para pensar como um programador!';
        let contador = 1
        let resultado = ""

        while (contador <= 7) {
            resultado += mensagem + "<br>"
            contador++;
        }
        div_msg.innerHTML = resultado;
    }
</script>
