<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="contar()">contar</button>
    <div id="div_msg"></div>
</body>
</html>

<script>
    let numero = 1;
    let resultado = "";

    function contar(){
        
        while (numero <= 15 ){
            resultado += numero + "<br>";
            numero++;
        }
        div_msg.innerHTML = resultado;
    }
</script>
