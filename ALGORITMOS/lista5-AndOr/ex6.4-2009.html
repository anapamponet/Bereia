<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoção Relâmpago</title>
</head>
<body>
    <h1>Promoção Relâmpago da Loja</h1>

    <label for="input_itens">Quantidade de itens comprados:</label>
    <input type="number" id="input_itens">
    <br>
    <label for="input_valor">Valor total da compra (R$):</label>
    <input type="number" id="input_valor">
    <br>
    <label for="select_fidelidade">É do programa de fidelidade?</label>
    <select id="select_fidelidade">
        <option value="sim">Sim</option>
        <option value="nao">Não</option>
    </select>
    <br>
    <label for="input_cupom">Cupom:</label>
    <input type="text" id="input_cupom">
    <br>

    <button onclick="aplicar()">Aplicar desconto</button>

    <script>
        function aplicar() {
            let itens = Number(input_itens.value)
            let valor = Number(input_valor.value)
            let fidelidade = select_fidelidade.value
            let cupom = input_cupom.value
            if (itens >= 3 && (fidelidade == 'sim' || cupom == 'PROMO10') && valor >= 50) {
                alert('Desconto aplicado!')
            } else {
                alert('Compra não elegível para desconto')
            }
        }
    </script>
</body>
</html>
