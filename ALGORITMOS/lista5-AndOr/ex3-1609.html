<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Simulador de Preço do Bilhete Único de São Paulo</h1>

    <label for="select_tipopessoa">Qual o tipo do passageiro?</label>
    <select id="select_tipopessoa">
        <option value="comum">Comum</option>
        <option value="estudante">Estudante</option>
        <option value="idoso">Idoso/PNE</option>
    </select>
    <br>
    <label for="select_tipopass">Qual o tipo da passagem?</label>
    <select id="select_tipopass">
        <option value="unica">Passagem única</option>
        <option value="integracao">Passagem integração</option>
    </select>

    <button onclick="simular()">Simule o valor:</button>
    <div id="div_mensagem"></div>

    <script>
        function simular() {
            let passageiro = select_tipopessoa.value
            let passagem = select_tipopass.value

            if (passagem == 'unica' && passageiro == 'comum') {
                div_mensagem.innerHTML = `Valor da passagem escolhida: R$4,40`
            } else if (passagem == 'integracao' && passageiro == 'comum') {
                div_mensagem.innerHTML = `Valor da passagem escolhida: R$5,90`
            } else if (passagem == 'unica' && passageiro == 'estudante') {
                div_mensagem.innerHTML = `Valor da passagem escolhida: R$2,20`
            } else if (passagem == 'integracao' && passageiro == 'estudante') {
                div_mensagem.innerHTML = `Valor da passagem escolhida: R$2,95`
            } else if (passageiro == 'idoso' && (passagem == 'unica' || passagem == 'integracao')) {
                div_mensagem.innerHTML = `Valor da passagem escolhida: R$0,00`
            }
        }
    </script>
</body>
</html>
