<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Nota vestibular:
    <input type="text" id="ipt_nota">
    Nota enem:
    <input type="text" id="ipt_enem">
    Nota redação:
    <input type="text" id="ipt_red">

    <button onclick="ver()">verificar aprovação</button>
</body>
</html>
<script>
    function ver(){
        let vest = Number(ipt_nota.value);
        let enem = Number(ipt_enem.value);
        let red = Number(ipt_red.value);

        if (red > 0 && (vest >= 700 || enem >= 650 ) ){
            alert(`Aprovado!`)
        } else {
            alert(`Não Aprovado.`)
        }
    }
</script>
