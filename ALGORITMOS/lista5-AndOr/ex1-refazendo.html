<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Qual a temperatura atual?
    <input type="text" id="input_temp">
    <button onclick="situacao()">Ver situação</button>
</body>
</html>
<script>
    function situacao(){
        let temperatura = Number(input_temp.value);
        if (temperatura >= 21 && temperatura <= 24){
            alert(`Temperatura confortável :D`)
        } else {
            alert(`Temperatura desconfortável!`)
        }
    }
</script>
