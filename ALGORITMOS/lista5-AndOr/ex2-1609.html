<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Simulador de Preferências de Compras: Será que Robervaldo Gostaria?</h1>

    <label for="input_tamanho">Informe o tamanho da tela do celular encontrado:</label>
    <input type="text" id="input_tamanho">
<br><br>
    <label for="select_cores">Informe a cor do celular encontrado: </label>

    <select id="select_cores">
        <option disabled selected value="#">Escolha aqui</option>
        <option>Preto</option>
        <option>Prata</option>
        <option>Azul</option>
        <option>Vermelho</option>
    </select>

    <button onclick="analisar()"> Será que ele gosta? </button>
    <div id="div_imagem"></div>
</body>
</html>

<script>
    function analisar(){
       let tamanho = Number(input_tamanho.value)
       let cor = select_cores.value

       if (tamanho > 6.5 && (cor == 'Preto' || cor == 'Prata')){
        div_imagem.innerHTML = `<img src="https://thumbs.dreamstime.com/b/emoticon-feliz-14427878.jpg?w=768">`
       } else{
        div_imagem.innerHTML = `<img src="https://static4.depositphotos.com/1016045/328/i/950/depositphotos_3282479-stock-illustration-sad-emoticon.jpg">`
       }
    }
</script>
