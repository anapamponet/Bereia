<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    tamanho:
    <input type="text" id="inpt_tam">
    <br>
    cor:
    <select id="select_cor">
        <option>Preto</option>
        <option>Prata</option>
        <option>Azul</option>
        <option>Vermelho</option>
    </select>    
    <button onclick="gosta()">será que ele gosta:</button>
    <div id="divmsg"></div>
</body>
</html>
<script>
    function gosta(){
        let tam = Number(inpt_tam.value);
        let cor = select_cor.value;

        if (tam <= 6.5 && (cor != 'Prata' || cor != 'Preto')){
            divmsg.innerHTML = `robervaldo odiou`
        } else{
            divmsg.innerHTML = `ele goxxxta`
        }
    }
</script>
