<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processo Seletivo</title>
</head>
<body>
    <h1>Processo Seletivo: Vestibular ou ENEM?</h1>

    <label for="input_vestibular">Nota do vestibular interno:</label>
    <input type="number" id="input_vestibular">
    <br>
    <label for="input_enem">Nota do ENEM:</label>
    <input type="number" id="input_enem">
    <br>
    <label for="input_redacao">Nota da redação:</label>
    <input type="number" id="input_redacao">
    <br>

    <button onclick="verificar()">Verificar aprovação</button>

    <script>
        function verificar() {
            let vestibular = Number(input_vestibular.value)
            let enem = Number(input_enem.value)
            let redacao = Number(input_redacao.value)
            if (vestibular >= 700 || (enem >= 650 && redacao > 0)) {
                alert('Aprovado!')
            } else {
                alert('Não aprovado')
            }
        }
    </script>
</body>
</html>
