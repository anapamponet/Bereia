<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in de Voo</title>
</head>
<body>
    <h1>Check-in de Voo</h1>

    <label for="select_documento">O documento está válido?</label>
    <select id="select_documento">
        <option value="sim">Sim</option>
        <option value="nao">Não</option>
    </select>
    <br>
    <label for="select_checkin">Fez check-in online?</label>
    <select id="select_checkin">
        <option value="sim">Sim</option>
        <option value="nao">Não</option>
    </select>
    <br>
    <label for="input_horas">Horas de antecedência ao chegar no aeroporto:</label>
    <input type="number" id="input_horas">
    <br>

    <button onclick="verificar()">Verificar embarque</button>

    <script>
        function verificar() {
            let documento = select_documento.value
            let checkin = select_checkin.value
            let horas = Number(input_horas.value)
            if (documento == 'sim' && (checkin == 'sim' || horas >= 2)) {
                alert('Embarque liberado')
            } else {
                alert('Embarque negado')
            }
        }
    </script>
</body>
</html>
