<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia 24 Horas</title>
</head>
<body>
    <h1>Acesso à Academia 24 Horas</h1>

    <label for="select_plano">Plano do aluno:</label>
    <select id="select_plano">
        <option value="premium">Premium</option>
        <option value="basico">Básico</option>
    </select>
    <br>
    <label for="input_hora">Hora atual (0 a 23):</label>
    <input type="number" id="input_hora">
    <br>
    <label for="select_biometria">Check-in biométrico validado?</label>
    <select id="select_biometria">
        <option value="sim">Sim</option>
        <option value="nao">Não</option>
    </select>
    <br>

    <button onclick="liberar()">Liberar catraca</button>

    <script>
        function liberar() {
            let plano = select_plano.value
            let hora = Number(input_hora.value)
            let biometria = select_biometria.value
            if ((plano == 'premium' || (plano == 'basico' && hora >= 6 && hora <= 22)) && biometria == 'sim') {
                alert('Acesso liberado')
            } else {
                alert('Acesso negado')
            }
        }
    </script>
</body>
</html>
