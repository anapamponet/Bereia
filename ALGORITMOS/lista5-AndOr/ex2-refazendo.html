<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Informe sua renda:
    <input type="text" id="input_renda">
    Informe renda familiar:
    <input type="text" id="input_rendafam">

    <button onclick="ver()">Verificar ajuda</button>
</body>
</html>
<script>
    function ver(){
        let renda = Number(input_renda.value);
        let rendafam = Number(input_rendafam.value);

        if (renda <= 1050 && rendafam <= 2100 ){
            alert(`Você terá direito!`)
        } else {
            alert(`Você não terá direito!`)
        }
    }
</script>
