<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprovação de Crédito</title>
</head>
<body>
    <h1>Aprovação de Crédito Bancário</h1>

    <label for="input_renda">Renda mensal (R$):</label>
    <input type="number" id="input_renda">
    <br>
    <label for="input_score">Score de crédito:</label>
    <input type="number" id="input_score">
    <br>
    <label for="input_anos">Há quantos anos é correntista:</label>
    <input type="number" id="input_anos">
    <br>
    <label for="select_dividas">Possui dívidas em aberto?</label>
    <select id="select_dividas">
        <option value="sim">Sim</option>
        <option value="nao">Não</option>
    </select>
    <br>

    <button onclick="analisar()">Analisar crédito</button>

    <script>
        function analisar() {
            let renda = Number(input_renda.value)
            let score = Number(input_score.value)
            let anos = Number(input_anos.value)
            let dividas = select_dividas.value

            if ((renda >= 3000 && score >= 600) || (anos > 5 && dividas == 'nao')) {
                alert('Empréstimo aprovado')
            } else {
                alert('Empréstimo negado')
            }
        }
    </script>
</body>
</html>
