<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolsa de Estudos</title>
</head>
<body>
    <h1>Bolsa de Estudos Integral</h1>

    <label for="input_renda">Renda familiar per capita (R$):</label>
    <input type="number" id="input_renda">
    <br>
    <label for="input_media">Média escolar:</label>
    <input type="number" id="input_media">
    <br>
    <label for="select_atleta">É atleta federado?</label>
    <select id="select_atleta">
        <option value="sim">Sim</option>
        <option value="nao">Não</option>
    </select>
    <br>

    <button onclick="verificar()">Verificar bolsa</button>

    <script>
        function verificar() {
            let renda = Number(input_renda.value)
            let media = Number(input_media.value)
            let atleta = select_atleta.value

            if ((renda <= 800 && media >= 8) || (atleta == 'sim' && media >= 6)) {
                alert('Bolsa integral concedida!')
            } else {
                alert('Bolsa não concedida')
            }
        }
    </script>
</body>
</html>
