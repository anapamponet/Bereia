<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
Distância inicial semanal do aluno (em km). <br>
<input type="text" id="ipt_inicio"><br>
O percentual de aumento semanal desejado (de 0 a 10). <br>
<input type="text" id="ipt_percsemanal"><br>
A meta de distância semanal (em km). <br>
<input type="text" id="ipt_metasemanal"><br>
O número máximo de semanas do plano. <br>
<input type="text" id="ipt_max"><br>

<button onclick="gerar()">gerar planilha</button>
<div id="div_mensagem"></div>
</body>
</html>
<script>
    function gerar(){
        let ini = Number(ipt_inicio.value)
        let percsem = Number(ipt_percsemanal.value)
        let meta = Number(ipt_metasemanal.value)
        let max = Number(ipt_max.value)
        let contador = 0
        let semanas = 0

        if(ini <= 0 || percsem <1 || percsem >10 || meta <= ini || max <1 || max > 24){
            div_mensagem.innerHTML = `Digite valores válidos`
        } else{
            while(ini < meta){
                semanas++

                if (semanas >1){
                let qtd =  ini * percsem/100
                ini += qtd }
                let percmeta = ini/100
                div_mensagem.innerHTML += ` SEMANA ${semanas} - ${ini.toFixed(2)} km (${percmeta.toFixed(2)}% da meta) <br>`
                
               
            }
            // if (semana % 4 == 0){
            //         let folga = ini - ini * 0.3
            //         div_mensagem.innerHTML +=  `SEMANA ${semanas} - ${folga} km (Y% da meta)`
            //     }

             if (ini >= meta){
                    div_mensagem.innerHTML += `Meta de ${meta} km atingida na semana ${semanas}! Total acumulado no plano: TTTT km`
                } else{
                    div_mensagem.innerHTML += `Meta não atingida em ${semanas} semanas. A última semana chegou a PPPP% da meta. Total acumulado no plano: TTTT km.`
                }
            
        }  
        
    }

</script>
